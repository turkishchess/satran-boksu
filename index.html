<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satranç Boksu</title>

<style>
body{
    background:#222;
    color:white;
    font-family:Arial;
    text-align:center;
}

#board{
    width:320px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(8,40px);
}

.square{
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    cursor:pointer;
}

.white{background:#eee;color:black;}
.black{background:#555;}

#mode{
    font-size:24px;
    margin-top:10px;
}

#timer{
    font-size:28px;
    margin:10px;
}
</style>
</head>

<body>

<h1>♟️ Satranç Boksu 🥊</h1>
<div id="mode">Satranç</div>
<div id="timer">03:00</div>

<div id="board"></div>

<script>
const board = document.getElementById("board");

const initial =
[
["♜","♞","♝","♛","♚","♝","♞","♜"],
["♟","♟","♟","♟","♟","♟","♟","♟"],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["","","","","","","",""],
["♙","♙","♙","♙","♙","♙","♙","♙"],
["♖","♘","♗","♕","♔","♗","♘","♖"]
];

let selected = null;

/* TAHTAYI ÇİZ */
function draw(){
    board.innerHTML="";
    for(let y=0;y<8;y++){
        for(let x=0;x<8;x++){
            const d=document.createElement("div");
            d.className="square "+((x+y)%2?"black":"white");
            d.textContent=initial[y][x];

            d.onclick=()=>{
                if(mode!=="Satranç") return;

                if(selected){
                    initial[y][x]=initial[selected.y][selected.x];
                    initial[selected.y][selected.x]="";
                    selected=null;
                    draw();
                }else if(initial[y][x]!=""){
                    selected={x,y};
                }
            };

            board.appendChild(d);
        }
    }
}

draw();

/* ZAMAN SİSTEMİ */
let mode="Satranç";
let time=180; // 3 dk

function tick(){
    time--;

    let m=Math.floor(time/60).toString().padStart(2,"0");
    let s=(time%60).toString().padStart(2,"0");
    document.getElementById("timer").textContent=m+":"+s;

    if(time<=0){
        if(mode==="Satranç"){
            mode="Boks";
            time=60;
        }else{
            mode="Satranç";
            time=180;
        }
        document.getElementById("mode").textContent=mode;
    }
}

setInterval(tick,1000);
</script>

</body>
</html>
