<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satranç Boksu</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
#board{width:320px;margin:20px auto;display:grid;grid-template-columns:repeat(8,40px)}
.square{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.white{background:#1faa00}.black{background:#b30000}
</style>
</head>
<body>
<h1>♟️ Satranç Boksu 🥊</h1>
<div id="board"></div>

<script>
const board=document.getElementById("board");

const start=[
"r","n","b","q","k","b","n","r",
"p","p","p","p","p","p","p","p",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"P","P","P","P","P","P","P","P",
"R","N","B","Q","K","B","N","R"
];

let pieces=[...start];
let selected=null;
let turn="white";

const icons={P:"♙",R:"♖",N:"♘",B:"♗",Q:"♕",K:"♔",p:"♟",r:"♜",n:"♞",b:"♝",q:"♛",k:"♚"};

function draw(){
  board.innerHTML="";
  pieces.forEach((p,i)=>{
    const d=document.createElement("div");
    const r=Math.floor(i/8),c=i%8;
    d.className="square "+((r+c)%2?"black":"white");
    d.textContent=icons[p]||"";
    if(p) d.style.color=p===p.toUpperCase()?"white":"black";
    d.onclick=()=>click(i);
    board.appendChild(d);
  });
}

function sameColor(a,b){
  if(!a||!b) return false;
  return (a===a.toUpperCase())===(b===b.toUpperCase());
}

function click(i){
  if(selected===null){
    if(!pieces[i]) return;
    if(turn==="white" && pieces[i]!==pieces[i].toUpperCase()) return;
    if(turn==="black" && pieces[i]!==pieces[i].toLowerCase()) return;
    selected=i;return;
  }

  if(i===selected){selected=null;return;}

  if(sameColor(pieces[selected],pieces[i])){selected=i;return;}

  // ŞİMDİLİK SERBEST HAMLE (oynanabilsin diye)
  pieces[i]=pieces[selected];
  pieces[selected]="";
  selected=null;
  turn=turn==="white"?"black":"white";
  draw();
}

draw();
</script>
</body>
</html>
