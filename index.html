<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satranç Boksu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #222;
      color: white;
    }

    h1 {
      margin-top: 20px;
    }

    #mode {
      font-size: 24px;
      margin: 10px;
    }

    #timer {
      font-size: 28px;
      margin-bottom: 20px;
    }

    #board {
      width: 320px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(8, 40px);
    }

    .square {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    .white { background: #eee; color: black; }
    .black { background: #666; }

    #boxing {
      display: none;
      font-size: 40px;
      margin-top: 30px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>♟️ Satranç Boksu 🥊</h1>

  <div id="mode">Mod: Satranç</div>
  <div id="timer">Kalan süre: 180</div>

  <div id="board"></div>

  <div id="boxing">🥊 BOKS ZAMANI! 🥊</div>

  <button onclick="startGame()">Başlat</button>

  <script>
    const board = document.getElementById("board");
    const modeText = document.getElementById("mode");
    const timerText = document.getElementById("timer");
    const boxingText = document.getElementById("boxing");

    let mode = "chess"; // chess veya boxing
    let time = 180; // 3 dk satranç
    let interval;

    const pieces = [
      "♜","♞","♝","♛","♚","♝","♞","♜",
      "♟","♟","♟","♟","♟","♟","♟","♟",
      "","","","","","","","",
      "","","","","","","","",
      "","","","","","","","",
      "","","","","","","","",
      "♙","♙","♙","♙","♙","♙","♙","♙",
      "♖","♘","♗","♕","♔","♗","♘","♖"
    ];

    function drawBoard() {
      board.innerHTML = "";
      pieces.forEach((piece, i) => {
        const square = document.createElement("div");
        square.className =
          "square " + ((Math.floor(i / 8) + i) % 2 === 0 ? "white" : "black");
        square.textContent = piece;
        board.appendChild(square);
      });
    }

    function switchMode() {
      if (mode === "chess") {
        mode = "boxing";
        time = 60; // 1 dk boks
        modeText.textContent = "Mod: Boks";
        boxingText.style.display = "block";
        board.style.display = "none";
      } else {
        mode = "chess";
        time = 180; // tekrar 3 dk satranç
        modeText.textContent = "Mod: Satranç";
        boxingText.style.display = "none";
        board.style.display = "grid";
      }
    }

    function startGame() {
      clearInterval(interval);
      drawBoard();
      interval = setInterval(() => {
        time--;
        timerText.textContent = "Kalan süre: " + time;

        if (time <= 0) {
          switchMode();
        }
      }, 1000);
    }

    drawBoard();
  </script>
</body>
</html>
